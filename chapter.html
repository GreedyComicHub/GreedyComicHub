<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Chapter - GreedyComicHub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Histats Start -->
    <script type="text/javascript" src="https://s10.histats.com/js15.js" async></script>
    <noscript><a href="https://www.histats.com" target="_blank"><img src="https://s10.histats.com/counters/cc_4960328.php" alt="web stats" border="0"></a></noscript>
    <!-- Histats End -->
</head>
<body>
    <header class="main-header">
        <h1 class="logo">GreedyComicHub</h1>
        <a href="https://www.histats.com/viewstats/?act=2&sid=4960328" target="_blank" class="histats-link">Histats</a>
    </header>
    <main class="main-content">
        <section class="chapter-reader">
            <div id="chapter-content"></div>
        </section>
    </main>
    <footer>
        <p>© 2025 GreedyComicHub. All rights reserved.</p>
    </footer>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('comic');
        const chapterNum = urlParams.get('chapter');
        let updatesData = {};

        // Ambil data updates
        fetch('data/updates.json')
            .then(res => {
                if (!res.ok) throw new Error('Failed to load updates.json');
                return res.json();
            })
            .then(data => {
                updatesData = data;
                renderChapter(comicId, chapterNum);
            })
            .catch(err => {
                console.error('Error loading data:', err);
                document.getElementById('chapter-content').innerHTML = '<p>Error loading chapter.</p>';
            });

        function renderChapter(comicId, chapterNum) {
            const update = Object.values(updatesData).find(u => u.comic_id === comicId && u.chapter === chapterNum);
            const chapterContent = document.getElementById('chapter-content');
            if (update && update.images) {
                chapterContent.innerHTML = update.images.map(img => `<img src="${img}" alt="Chapter ${chapterNum} Page">`).join('');
            } else {
                chapterContent.innerHTML = '<p>Chapter tidak ditemukan atau gambar tidak tersedia.</p>';
            }
        }
    </script>
</body>
</html>
