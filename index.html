<!DOCTYPE html>
<!-- index.html: Homepage with comics from data/index.json and updates from data/updates.json -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="gYzqR5FT6BN_7xVgfMnzNsaEOBA_ojcYypM_knTHWow" />
    <title>GreedyComicHub - Read Comics Online Free</title>
    <meta name="description" content="GreedyComicHub is your free online comic reading destination. Discover and read your favorite comics!">
    <meta name="keywords" content="greedycomichub, greedy comic, comic reading, manga, webtoon, free comics online">
    <meta name="robots" content="index, follow">
    <meta name="author" content="GreedyComicHub Team">
    <meta name="theme-color" content="#121212">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <!-- Histats Analytics -->
    <script type="text/javascript" src="https://s10.histats.com/js15.js" async></script>
    <noscript><a href="https://www.histats.com" target="_blank"><img src="https://s10.histats.com/counters/cc_4960328.php" alt="web stats" border="0"></a></noscript>
</head>
<body>
    <header class="main-header">
        <a href="index.html" class="logo">Greedy<span>Comic</span>Hub</a>
        <div class="search-group">
            <select id="genre-filter" class="genre-select" aria-label="Filter by genre"></select>
            <input type="text" id="search-bar" class="search-bar" placeholder="Search comics..." aria-label="Search comics">
        </div>
        <button id="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light mode">🌙</button>
        <a href="https://www.histats.com/viewstats/?act=2&sid=4960328" target="_blank" class="histats-link" aria-label="View statistics">Stats</a>
    </header>
    
    <main class="main-content">
        <section id="update-section">
            <h2>Latest Updates</h2>
            <div id="update-list" class="comic-grid"></div>
            <div id="update-pagination" class="pagination" role="navigation" aria-label="Update pagination"></div>
        </section>
        
        <section id="comic-list-section">
            <h2>All Comics</h2>
            <div id="comic-list"></div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 GreedyComicHub. All rights reserved.</p>
    </footer>
    
    <button id="scroll-to-top" aria-label="Scroll to top" title="Back to top">↑</button>
    
    <script src="script.js"></script>
    <script>
        let allComics = [];
        let updatesData = {};
        let currentPages = { updates: 1, comics: {} };
        const isMobile = window.innerWidth <= 600;
        const comicsPerPage = isMobile ? 3 : 10;
        const updatesPerPage = isMobile ? 3 : 10;
        let originalComics = [];
        let comicChapterCache = {};

        // Load data on page start
        Promise.all([
            fetch('data/index.json').then(res => res.json()),
            fetch('data/updates.json').then(res => res.json())
        ])
        .then(([indexData, updates]) => {
            allComics = Object.keys(indexData).map(comicId => ({ id: comicId, ...indexData[comicId] }));
            console.log('First comic:', allComics[0]); // Debug logging
            originalComics = [...allComics];
            updatesData = updates;
            currentPages = allComics.reduce((acc, comic) => {
                const type = comic.type || 'Unknown';
                if (!acc.comics[type]) acc.comics[type] = 1;
                return acc;
            }, { updates: 1, comics: {} });
            
            // Use total_chapters from index.json
            allComics.forEach(comic => {
                comicChapterCache[comic.id] = comic.total_chapters || 'N/A';
            });
            
            populateGenreFilter();
            renderComics();
            renderUpdates();
        })
        .catch(err => console.error('Error loading data:', err));

        function populateGenreFilter() {
            const genreFilter = document.getElementById('genre-filter');
            const genres = new Set(allComics.map(comic => comic.genre).filter(genre => genre));
            genreFilter.innerHTML = '<option value="">All Genres</option>';
            genres.forEach(genre => {
                const option = document.createElement('option');
                option.value = genre;
                option.textContent = genre;
                genreFilter.appendChild(option);
            });
            genreFilter.addEventListener('change', (e) => {
                const selectedGenre = e.target.value;
                if (!selectedGenre) {
                    allComics = [...originalComics];
                } else {
                    allComics = originalComics.filter(comic => comic.genre === selectedGenre);
                }
                currentPages.comics = allComics.reduce((acc, comic) => {
                    const type = comic.type || 'Unknown';
                    if (!acc[type]) acc[type] = 1;
                    return acc;
                }, {});
                renderComics();
            });
        }

        // Render main comics with pagination
        function renderComics() {
            const comicList = document.getElementById('comic-list');
            comicList.innerHTML = '';
            const comicsByType = {};
            allComics.forEach(comic => {
                const type = comic.type || 'Unknown';
                if (!comicsByType[type]) comicsByType[type] = [];
                comicsByType[type].push(comic);
            });
            Object.keys(comicsByType).forEach(type => {
                const typeSection = document.createElement('div');
                typeSection.className = 'type-section';
                typeSection.innerHTML = `<h3 style="font-size: 1.5em; margin: 30px 0 20px; color: var(--accent); font-family: 'Poppins', sans-serif; font-weight: 700;">${type}</h3>`;
                const typeGrid = document.createElement('div');
                typeGrid.className = 'comic-grid';
                const startIndex = (currentPages.comics[type] - 1) * comicsPerPage;
                const endIndex = startIndex + comicsPerPage;
                const paginatedComics = comicsByType[type].slice(startIndex, endIndex);
                paginatedComics.forEach(comic => {
                    const card = document.createElement('div');
                    card.id = `comic-card-${comic.id}`;
                    card.className = 'comic-card';
                    const latestChapter = comicChapterCache[comic.id] || 'N/A';
                    const displayChapter = latestChapter === 'N/A' ? 'N/A' : `Ch ${latestChapter}`;
                    card.innerHTML = `
                        <a href="comic.html?comic=${comic.id}">
                            <img src="${comic.cover || 'placeholder.jpg'}" alt="${comic.title} - GreedyComicHub" class="comic-cover" loading="lazy">
                            <div class="card-text">
                                <h3>${comic.title}</h3>
                                <p class="last-chapter">${displayChapter}</p>
                            </div>
                        </a>
                    `;
                    typeGrid.appendChild(card);
                });
                if (paginatedComics.length > 0) {
                    typeSection.appendChild(typeGrid);
                    const pagination = document.createElement('div');
                    pagination.className = 'pagination';
                    const totalPages = Math.ceil(comicsByType[type].length / comicsPerPage);
                    renderDynamicPagination(pagination, totalPages, currentPages.comics[type], type, 'comics');
                    typeSection.appendChild(pagination);
                    comicList.appendChild(typeSection);
                }
            });
        }

        // Render updates with pagination
        function renderUpdates() {
            const updateList = document.getElementById('update-list');
            const updatePagination = document.getElementById('update-pagination');
            const updates = Object.values(updatesData).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            const now = new Date();
            const twoDaysAgo = new Date(now.getTime() - 2 * 24 * 60 * 60 * 1000);
            const recentUpdates = updates.filter(update => new Date(update.timestamp) >= twoDaysAgo);

            updateList.innerHTML = '';
            updatePagination.innerHTML = '';

            if (recentUpdates.length > 0) {
                const startIndex = (currentPages.updates - 1) * updatesPerPage;
                const endIndex = startIndex + updatesPerPage;
                const paginatedUpdates = recentUpdates.slice(startIndex, endIndex);

                paginatedUpdates.forEach(update => {
                    const card = document.createElement('div');
                    card.className = 'comic-card';
                    const chapterNum = parseFloat(update.chapter);
                    const displayChapter = chapterNum % 1 === 0 ? Math.floor(chapterNum) : chapterNum;
                    card.innerHTML = `
                        <a href="comic.html?comic=${update.comic_id}">
                            <img src="${update.thumbnail || 'placeholder.jpg'}" alt="${update.title} - GreedyComicHub" class="comic-cover" loading="lazy">
                            <div class="card-text">
                                <h3>${update.title}</h3>
                                <p class="last-chapter">Ch ${displayChapter}</p>
                            </div>
                        </a>
                    `;
                    updateList.appendChild(card);
                });

                const totalPages = Math.ceil(recentUpdates.length / updatesPerPage);
                renderDynamicPagination(updatePagination, totalPages, currentPages.updates, 'updates', 'updates');
            } else {
                updateList.innerHTML = '<p class="no-updates">No recent updates.</p>';
            }
        }

        // Dynamic pagination function
        function renderDynamicPagination(paginationElement, totalPages, currentPage, sectionKey, sectionType = 'updates') {
            paginationElement.innerHTML = '';
            const visiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(visiblePages / 2));
            let endPage = Math.min(totalPages, startPage + visiblePages - 1);

            if (endPage - startPage < visiblePages - 1) {
                startPage = Math.max(1, endPage - visiblePages + 1);
            }

            const prevButton = document.createElement('button');
            prevButton.textContent = '←';
            prevButton.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) {
                    if (sectionType === 'updates') {
                        currentPages.updates = currentPage - 1;
                        renderUpdates();
                    } else {
                        currentPages.comics[sectionKey] = currentPage - 1;
                        renderComics();
                    }
                }
            });
            paginationElement.appendChild(prevButton);

            if (startPage > 1) {
                const ellipsisLeft = document.createElement('span');
                ellipsisLeft.textContent = '...';
                ellipsisLeft.className = 'ellipsis';
                paginationElement.appendChild(ellipsisLeft);
            }

            for (let i = startPage; i <= endPage; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageButton.addEventListener('click', () => {
                    if (sectionType === 'updates') {
                        currentPages.updates = i;
                        renderUpdates();
                    } else {
                        currentPages.comics[sectionKey] = i;
                        renderComics();
                    }
                });
                paginationElement.appendChild(pageButton);
            }

            if (endPage < totalPages) {
                const ellipsisRight = document.createElement('span');
                ellipsisRight.textContent = '...';
                ellipsisRight.className = 'ellipsis';
                paginationElement.appendChild(ellipsisRight);
            }

            const nextButton = document.createElement('button');
            nextButton.textContent = '→';
            nextButton.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    if (sectionType === 'updates') {
                        currentPages.updates = currentPage + 1;
                        renderUpdates();
                    } else {
                        currentPages.comics[sectionKey] = currentPage + 1;
                        renderComics();
                    }
                }
            });
            paginationElement.appendChild(nextButton);
        }

        // Search functionality
        document.getElementById('search-bar').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                allComics = [...originalComics];
                currentPages.comics = originalComics.reduce((acc, comic) => {
                    const type = comic.type || 'Unknown';
                    if (!acc[type]) acc[type] = 1;
                    return acc;
                }, {});
                renderComics();
                return;
            }
            const filteredComics = originalComics.filter(comic => 
                comic.title.toLowerCase().includes(query) || 
                (comic.genre && comic.genre.toLowerCase().includes(query))
            );
            allComics = filteredComics;
            currentPages.comics = filteredComics.reduce((acc, comic) => {
                const type = comic.type || 'Unknown';
                if (!acc[type]) acc[type] = 1;
                return acc;
            }, {});
            renderComics();
        });
    </script>
</body>
</html>
