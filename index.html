<!DOCTYPE html>
<!-- index.html: Halaman utama menampilkan semua komik dari data/index.json dan update dari data/updates.json -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="gYzqR5FT6BN_7xVgfMnzNsaEOBA_ojcYypM_knTHWow" />
    <title>GreedyComicHub - Baca Komik Online Gratis</title>
    <meta name="description" content="GreedyComicHub adalah tempat baca komik online gratis. Temukan komik favoritmu seperti Magic Emperor di Greedy Comic Hub!">
    <meta name="keywords" content="greedycomichub, greedy comic, greedy comichub, greedy comic hub, baca komik online, komik gratis">
    <meta name="robots" content="index, follow">
    <meta name="author" content="GreedyComicHub Team">
    <link rel="stylesheet" href="style.css">
    <!-- Histats Start -->
    <script type="text/javascript" src="https://s10.histats.com/js15.js" async></script>
    <noscript><a href="https://www.histats.com" target="_blank"><img src="https://s10.histats.com/counters/cc_4960328.php" alt="web stats" border="0"></a></noscript>
    <!-- Histats End -->
</head>
<body>
    <header class="main-header">
        <h1 class="logo">GreedyComicHub</h1>
        <a href="https://www.histats.com/viewstats/?act=2&sid=4960328" target="_blank" class="histats-link">Histats</a>
        <input type="text" id="search-bar" class="search-bar" placeholder="Search comics by title or genre...">
    </header>
    <main class="main-content">
        <section class="ad-grid">
            <div class="ad-placeholder"></div>
            <div class="ad-placeholder"></div>
            <div class="ad-placeholder"></div>
        </section>
        <section id="update-section">
            <h2>Update <span class="new-label">(new)</span></h2>
            <div id="update-list" class="comic-grid"></div>
        </section>
        <section id="comic-list-section">
            <h2>Komik</h2>
            <div id="comic-list"></div>
        </section>
        <section class="ad-footer">
            <div class="ad-placeholder"></div>
        </section>
    </main>
    <footer>
        <p>© 2025 GreedyComicHub. All rights reserved.</p>
    </footer>
    <script>
        let allComics = [];
        let updatesData = {};

        // Ambil index.json dan updates.json
        Promise.all([
            fetch('data/index.json').then(res => {
                if (!res.ok) throw new Error('Failed to load index.json');
                return res.json();
            }),
            fetch('data/updates.json').then(res => {
                if (!res.ok) throw new Error('Failed to load updates.json');
                return res.json();
            })
        ])
        .then(([indexData, updates]) => {
            allComics = Object.keys(indexData).map(comicId => ({ id: comicId, ...indexData[comicId] }));
            updatesData = updates;
            renderComics(allComics);
            renderUpdates();
        })
        .catch(err => {
            console.error('Error loading data:', err);
            document.getElementById('comic-list').innerHTML = '<p>Error loading comics.</p>';
            document.getElementById('update-list').innerHTML = '<p>Error loading updates.</p>';
        });

        // Render komik utama
        function renderComics(comics) {
            const comicList = document.getElementById('comic-list');
            comicList.innerHTML = '';
            const comicsByType = {};
            comics.forEach(comic => {
                const type = comic.type || 'Unknown';
                if (!comicsByType[type]) comicsByType[type] = [];
                comicsByType[type].push(comic);
            });
            Object.keys(comicsByType).forEach(type => {
                const typeSection = document.createElement('div');
                typeSection.className = 'type-section';
                typeSection.innerHTML = `<h2>${type}</h2>`;
                const typeGrid = document.createElement('div');
                typeGrid.className = 'comic-grid';
                comicsByType[type].forEach(comic => {
                    const latestChapter = getLatestChapter(comic.id);
                    const card = document.createElement('div');
                    card.className = 'comic-card';
                    card.innerHTML = `
                        <a href="comic.html?comic=${comic.id}">
                            <img src="${comic.cover || 'placeholder.jpg'}" alt="${comic.title} - GreedyComicHub" class="comic-cover">
                            <div class="card-text">
                                <h3>${comic.title}</h3>
                                <p class="last-chapter">Last: Ch ${latestChapter || 'N/A'}</p>
                            </div>
                        </a>
                    `;
                    typeGrid.appendChild(card);
                });
                typeSection.appendChild(typeGrid);
                comicList.appendChild(typeSection);
            });
        }

        // Render update
        function renderUpdates() {
            const updateList = document.getElementById('update-list');
            const now = new Date();
            const twoDaysAgo = new Date(now.getTime() - 2 * 24 * 60 * 60 * 1000);
            const updates = Object.values(updatesData).filter(update => {
                const updateTime = new Date(update.timestamp);
                return updateTime >= twoDaysAgo;
            }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            updates.forEach(update => {
                const card = document.createElement('div');
                card.className = 'comic-card';
                card.innerHTML = `
                    <a href="comic.html?comic=${update.comic_id}&chapter=${update.chapter}">
                        <img src="${update.thumbnail || 'placeholder.jpg'}" alt="${update.title} - GreedyComicHub" class="comic-cover">
                        <div class="card-text">
                            <h3>${update.title} - Ch ${update.chapter}</h3>
                        </div>
                    </a>
                `;
                updateList.appendChild(card);
            });
            if (!updates.length) {
                updateList.innerHTML = '<p>Belum ada update baru.</p>';
            }
        }

        // Fungsi untuk dapatkan chapter terakhir berdasarkan comic ID
        function getLatestChapter(comicId) {
            const comicUpdates = Object.values(updatesData).filter(update => update.comic_id === comicId);
            if (comicUpdates.length === 0) return null;
            return comicUpdates.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0].chapter;
        }

        // Search bar
        document.getElementById('search-bar').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query) {
                renderComics(allComics);
                return;
            }
            const filteredComics = allComics.filter(comic => 
                comic.title.toLowerCase().includes(query) || 
                (comic.genre && comic.genre.toLowerCase().includes(query))
            );
            renderComics(filteredComics);
        });
    </script>
</body>
</html>
