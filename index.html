<!DOCTYPE html>
<!-- index.html: Halaman utama menampilkan semua komik dari data/index.json dan update dari data/updates.json, tanpa paginasi, scroll horizontal murni CSS -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="gYzqR5FT6BN_7xVgfMnzNsaEOBA_ojcYypM_knTHWow" />
    <title>GreedyComicHub - Baca Komik Online Gratis</title>
    <meta name="description" content="GreedyComicHub adalah tempat baca komik online gratis. Temukan komik favoritmu seperti Magic Emperor di Greedy Comic Hub!">
    <meta name="keywords" content="greedycomichub, greedy comic, greedy comichub, greedy comic hub, baca komik online, komik gratis">
    <meta name="robots" content="index, follow">
    <meta name="author" content="GreedyComicHub Team">
    <link rel="stylesheet" href="style.css?v=7">
    <!-- Histats Start -->
    <script type="text/javascript" src="https://s10.histats.com/js15.js" async></script>
    <noscript><a href="https://www.histats.com" target="_blank"><img src="https://s10.histats.com/counters/cc_4960328.php" alt="web stats" border="0"></a></noscript>
    <!-- Histats End -->
</head>
<body>
    <header class="main-header">
        <a href="index.html" class="logo">Greedy<span>Comic</span>Hub</a>
        <div class="search-group">
            <select id="genre-filter" class="genre-select"></select>
            <input type="text" id="search-bar" class="search-bar" placeholder="Search comics by title or genre...">
        </div>
        <a href="https://www.histats.com/viewstats/?act=2&sid=4960328" target="_blank" class="histats-link">Histats</a>
    </header>
    <main class="main-content">
        <section id="update-section">
            <h2 class="fancy-title">Update</h2>
            <div id="update-list" class="comic-grid"></div>
        </section>
        <section id="comic-list-section">
            <h2 class="fancy-title">Komik</h2>
            <div id="comic-list"></div>
        </section>
    </main>
    <footer>
        <p>© 2025 GreedyComicHub. All rights reserved.</p>
    </footer>
    <script>
        let allComics = [];
        let updatesData = {};
        let comicChapterCache = {};
        let originalComics = [];

        Promise.all([
            fetch('data/index.json').then(res => res.json()),
            fetch('data/updates.json').then(res => res.json())
        ])
        .then(([indexData, updates]) => {
            console.log('Data loaded:', { comics: Object.keys(indexData).length, updates: Object.keys(updates).length });
            allComics = Object.keys(indexData).map(comicId => ({ id: comicId, ...indexData[comicId] }));
            originalComics = [...allComics];
            updatesData = updates;
            allComics.forEach(comic => {
                fetch(`data/${comic.id}.json`)
                    .then(res => res.json())
                    .then(data => {
                        comicChapterCache[comic.id] = Object.keys(data.chapters || {}).sort((a, b) => a - b).pop() || 'N/A';
                    })
                    .catch(err => console.error(`Error fetching ${comic.id}:`, err));
            });
            populateGenreFilter();
            renderComics();
            renderUpdates();
        })
        .catch(err => console.error('Error loading data:', err));

        function populateGenreFilter() {
            const genreFilter = document.getElementById('genre-filter');
            const genres = new Set(allComics.map(comic => comic.genre).filter(genre => genre));
            genreFilter.innerHTML = '<option value="">All Genres</option>';
            genres.forEach(genre => {
                const option = document.createElement('option');
                option.value = genre;
                option.textContent = genre;
                genreFilter.appendChild(option);
            });
            genreFilter.addEventListener('change', (e) => {
                const selectedGenre = e.target.value;
                if (!selectedGenre) {
                    allComics = [...originalComics];
                } else {
                    allComics = originalComics.filter(comic => comic.genre === selectedGenre);
                }
                renderComics();
                renderUpdates();
            });
        }

        function renderComics() {
            console.log('Rendering comics, browser:', navigator.userAgent);
            const comicList = document.getElementById('comic-list');
            comicList.innerHTML = '';
            const comicsByType = {};
            allComics.forEach(comic => {
                const type = comic.type || 'Unknown';
                if (!comicsByType[type]) comicsByType[type] = [];
                comicsByType[type].push(comic);
            });
            Object.keys(comicsByType).forEach(type => {
                const typeSection = document.createElement('div');
                typeSection.className = 'type-section';
                typeSection.dataset.type = type;
                typeSection.innerHTML = `<h2 class="fancy-type">${type}</h2>`;
                const typeGrid = document.createElement('div');
                typeGrid.className = 'comic-grid';
                comicsByType[type].forEach(comic => {
                    const card = document.createElement('div');
                    card.id = `comic-card-${comic.id}`;
                    card.className = 'comic-card';
                    const latestChapter = comicChapterCache[comic.id] || 'N/A';
                    card.innerHTML = `
                        <a href="comic.html?comic=${comic.id}">
                            <img src="${comic.cover || 'placeholder.jpg'}" alt="${comic.title} - GreedyComicHub" class="comic-cover">
                            <div class="card-text">
                                <h3>${comic.title}</h3>
                                <p class="last-chapter">${latestChapter}</p>
                            </div>
                        </a>
                    `;
                    typeGrid.appendChild(card);
                });
                if (comicsByType[type].length > 0) {
                    typeSection.appendChild(typeGrid);
                    comicList.appendChild(typeSection);
                }
            });
            // Log ukuran kartu untuk debug
            const cards = document.querySelectorAll('.comic-card');
            cards.forEach((card, i) => {
                const img = card.querySelector('img');
                console.log(`Card ${i + 1}: width=${card.offsetWidth}px, height=${card.offsetHeight}px, img width=${img.offsetWidth}px, img height=${img.offsetHeight}px`);
            });
        }

        function renderUpdates() {
            console.log('Rendering updates, browser:', navigator.userAgent);
            const updateList = document.getElementById('update-list');
            updateList.innerHTML = '';
            const updates = Object.values(updatesData).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            const now = new Date();
            const twoDaysAgo = new Date(now.getTime() - 2 * 24 * 60 * 60 * 1000);
            const recentUpdates = updates.filter(update => new Date(update.timestamp) >= twoDaysAgo);

            if (recentUpdates.length > 0) {
                recentUpdates.forEach(update => {
                    const card = document.createElement('div');
                    card.className = 'comic-card';
                    const chapterNum = parseFloat(update.chapter);
                    const displayChapter = chapterNum % 1 === 0 ? Math.floor(chapterNum) : chapterNum;
                    card.innerHTML = `
                        <a href="comic.html?comic=${update.comic_id}&chapter=${update.chapter}">
                            <img src="${update.thumbnail || 'placeholder.jpg'}" alt="${update.title} - GreedyComicHub" class="comic-cover">
                            <div class="card-text">
                                <h3>${update.title} - Ch ${displayChapter}</h3>
                            </div>
                        </a>
                    `;
                    updateList.appendChild(card);
                });
            } else {
                updateList.innerHTML = '<p class="no-updates">Belum ada update baru.</p>';
            }
            // Log ukuran kartu untuk debug
            const cards = document.querySelectorAll('#update-list .comic-card');
            cards.forEach((card, i) => {
                const img = card.querySelector('img');
                console.log(`Update card ${i + 1}: width=${card.offsetWidth}px, height=${card.offsetHeight}px, img width=${img.offsetWidth}px, img height=${img.offsetHeight}px`);
            });
        }

        document.getElementById('search-bar').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                allComics = [...originalComics];
            } else {
                allComics = originalComics.filter(comic => 
                    comic.title.toLowerCase().includes(query) || 
                    (comic.genre && comic.genre.toLowerCase().includes(query))
                );
            }
            renderComics();
            renderUpdates();
        });
    </script>
</body>
</html>
