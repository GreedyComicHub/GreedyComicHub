<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komik Detail - GreedyComicHub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Histats Start -->
    <script type="text/javascript" src="https://s10.histats.com/js15.js" async></script>
    <noscript><a href="https://www.histats.com" target="_blank"><img src="https://s10.histats.com/counters/cc_4960328.php" alt="web stats" border="0"></a></noscript>
    <!-- Histats End -->
</head>
<body>
    <header class="main-header">
        <h1 class="logo">GreedyComicHub</h1>
        <a href="https://www.histats.com/viewstats/?act=2&sid=4960328" target="_blank" class="histats-link">Histats</a>
    </header>
    <main class="main-content">
        <section class="comic-detail">
            <div id="comic-info"></div>
            <div id="chapter-list" class="chapter-grid"></div>
        </section>
    </main>
    <footer>
        <p>© 2025 GreedyComicHub. All rights reserved.</p>
    </footer>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('comic');
        let allComics = [];
        let updatesData = {};

        // Ambil data
        Promise.all([
            fetch('data/index.json').then(res => res.json()),
            fetch('data/updates.json').then(res => res.json())
        ])
        .then(([indexData, updates]) => {
            allComics = Object.keys(indexData).map(id => ({ id, ...indexData[id] }));
            updatesData = updates;
            renderComicDetail(comicId);
        })
        .catch(err => {
            console.error('Error loading data:', err);
            document.getElementById('comic-info').innerHTML = '<p>Error loading comic details.</p>';
        });

        function renderComicDetail(comicId) {
            const comic = allComics.find(c => c.id === comicId);
            if (!comic) {
                document.getElementById('comic-info').innerHTML = '<p>Komik tidak ditemukan.</p>';
                return;
            }

            const comicInfo = document.getElementById('comic-info');
            comicInfo.innerHTML = `
                <img src="${comic.cover || 'placeholder.jpg'}" alt="${comic.title}" class="comic-cover">
                <h2>${comic.title}</h2>
                <p>${comic.description || 'Tidak ada deskripsi'}</p>
            `;

            const chapterList = document.getElementById('chapter-list');
            const chapters = Object.values(updatesData)
                .filter(update => update.comic_id === comicId)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            if (chapters.length > 0) {
                chapters.forEach(chapter => {
                    const chapterCard = document.createElement('div');
                    chapterCard.className = 'chapter-card';
                    chapterCard.innerHTML = `
                        <a href="chapter.html?comic=${comicId}&chapter=${chapter.chapter}">
                            <h3>Chapter ${chapter.chapter}</h3>
                        </a>
                    `;
                    chapterList.appendChild(chapterCard);
                });
            } else {
                chapterList.innerHTML = '<p>Tidak ada chapter tersedia.</p>';
            }
        }
    </script>
</body>
</html>
